services:
  - type: web
    name: securetrace
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -e ./backend && npm install --prefix frontend && npm run build --prefix frontend
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SECUREDOC_JWT_SECRET
        generateValue: true
      - key: CRYPTATRACE_LLM_URL
        value: http://127.0.0.1:11434
      - key: CRYPTATRACE_LLM_MODEL
        value: llama3.2
      - key: CRYPTATRACE_LLM_TIMEOUT
        value: "90"
