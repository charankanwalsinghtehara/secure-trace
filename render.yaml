services:
  - type: web
    name: securetrace-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: CORS_ALLOWED_ORIGINS
        value: https://securetrace-web.onrender.com
      - key: SECUREDOC_JWT_SECRET
        generateValue: true
      - key: CRYPTATRACE_LLM_URL
        value: http://127.0.0.1:11434
      - key: CRYPTATRACE_LLM_MODEL
        value: llama3.2
      - key: CRYPTATRACE_LLM_TIMEOUT
        value: "90"

  - type: static
    name: securetrace-web
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://securetrace-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
